{% extends 'base.html' %}

{% block title %}Viewer - {{ manual.title }}{% endblock %}

{% block extra_head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
    #pdf-container {
        user-select: none;
        -webkit-user-select: none;
        background-color: #020617;
    }
    .page-wrapper {
        position: relative;
        margin-bottom: 40px;
        display: flex;
        justify-content: center;
        box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5);
        border-radius: 4px;
        overflow: hidden;
        animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .watermark-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .watermark-text {
        color: rgba(255, 255, 255, 0.08);
        font-size: 24px;
        transform: rotate(-45deg);
        white-space: nowrap;
        margin: 100px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.2em;
    }
    #viewer-controls {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
    }
    canvas {
        max-width: 100%;
        height: auto !important;
    }
    .loading-pulse {
        width: 100%;
        height: 800px;
        background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
        background-size: 200% 100%;
        animation: pulse 1.5s infinite;
        border-radius: 8px;
        margin-bottom: 40px;
    }
    @keyframes pulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
    @media (max-width: 768px) {
        .watermark-text {
            font-size: 14px;
            margin: 50px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="fixed inset-0 z-[60] bg-[#020617] flex flex-col overflow-hidden animate-fade-in" oncontextmenu="return false;">
    <!-- Header Controls -->
    <div id="viewer-controls" class="border-b border-white/5 p-3 md:p-5 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3 md:gap-6">
            <a href="{% url 'manuals:manual_list' manual.vehicle_model.brand.slug manual.vehicle_model.slug manual.year %}" 
               class="text-slate-400 hover:text-white transition-all p-2 hover:bg-white/5 rounded-xl active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </a>
            <div class="flex flex-col">
                <h1 class="text-white font-bold truncate max-w-[150px] sm:max-w-xs md:max-w-md text-sm md:text-lg leading-tight">{{ manual.title }}</h1>
                <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">{{ manual.vehicle_model.brand.name }} {{ manual.vehicle_model.name }}</span>
            </div>
        </div>
        
        <div class="flex items-center gap-3 md:gap-6">
            <div id="page-info" class="bg-white/5 px-4 py-2 rounded-xl border border-white/5 text-slate-300 text-[10px] md:text-xs font-bold tracking-widest hidden sm:block uppercase">
                Vorbereiten...
            </div>
            <div class="flex gap-2">
                <button id="zoom-out" class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-all active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
                </button>
                <button id="zoom-in" class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-all active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- PDF Canvas Container -->
    <div id="pdf-container" class="flex-grow overflow-auto p-4 md:p-12 flex flex-col items-center custom-scrollbar">
        <div id="pdf-render-target" class="w-full flex flex-col items-center max-w-5xl">
            <div class="loading-pulse"></div>
            <div class="loading-pulse"></div>
        </div>
    </div>
</div>

<script>
    const url = "{{ manual.file.url }}";
    const userEmail = "{{ user.email }}";
    const today = "{% now 'd.m.Y H:i' %}";
    
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let pdfDoc = null;
    let scale = window.innerWidth < 768 ? 0.8 : 1.25;
    const target = document.getElementById('pdf-render-target');

    async function renderPage(num) {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale });
        
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = `page-${num}`;
        
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = {
            canvasContext: context,
            viewport: viewport
        };
        
        const watermarkOverlay = document.createElement('div');
        watermarkOverlay.className = 'watermark-overlay';
        
        // Add watermark grid
        for(let i=0; i<12; i++) {
            const span = document.createElement('div');
            span.className = 'watermark-text';
            span.innerText = `${userEmail} | ${today}`;
            watermarkOverlay.appendChild(span);
        }

        wrapper.appendChild(canvas);
        wrapper.appendChild(watermarkOverlay);
        target.appendChild(wrapper);

        await page.render(renderContext).promise;
    }

    async function loadPDF() {
        try {
            pdfDoc = await pdfjsLib.getDocument(url).promise;
            document.getElementById('page-info').innerText = `Gesamt: ${pdfDoc.numPages} Seiten`;
            
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                await renderPage(i);
            }
        } catch (error) {
            console.error('Error loading PDF:', error);
            document.getElementById('page-info').innerText = 'Fehler beim Laden';
        }
    }

    // Zoom controls
    document.getElementById('zoom-in').addEventListener('click', () => {
        scale += 0.25;
        target.innerHTML = '';
        loadPDF();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
        if (scale > 0.5) {
            scale -= 0.25;
            target.innerHTML = '';
            loadPDF();
        }
    });

    // Anti-Print / Anti-Save
    window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's')) {
            e.preventDefault();
            alert('Drucken und Speichern ist in diesem System deaktiviert.');
        }
    });

    loadPDF();
</script>
{% endblock %}
