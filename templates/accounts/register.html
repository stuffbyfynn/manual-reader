{% extends 'base.html' %}

{% block title %}Registrieren - Manual Reader{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="glass p-8 rounded-3xl border border-slate-700 shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-4xl mb-4 block">🎟️</span>
            <h1 class="text-2xl font-bold text-white">Account erstellen</h1>
            <p class="text-slate-400 mt-2">Einladungscode erforderlich</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Einladungscode</label>
                <input type="text" name="code" value="{{ code|default:'' }}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="XYZ123ABC">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">E-Mail Adresse</label>
                <input type="email" name="email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="name@beispiel.de">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Passwort</label>
                <input type="password" name="password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Min. 8 Zeichen">
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.98]">
                Registrieren
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <p class="text-slate-500 text-sm">
                Bereits registriert? 
                <a href="{% url 'accounts:login' %}" class="text-blue-500 hover:text-blue-400 font-medium">Zum Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
